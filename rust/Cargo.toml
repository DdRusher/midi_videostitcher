[package]
name = "midi-videostitcher-rust"
version = "0.5.0"
edition = "2021"
description = "Native Chinese MIDI video stitcher with a Rust audio and scheduling core"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
midly = "0.5.3"
rand = "0.8.5"
rayon = "1.10"
memmap2 = "0.9"
hound = "3.5"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
font8x8 = "0.3"
ab_glyph = "0.2"
blake3 = { version = "1", features = ["pure"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11"], optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[[bin]]
name = "midi-videostitcher-rust"
path = "src/main.rs"

[[bin]]
name = "midi-videostitcher"
path = "src/gui_main.rs"
required-features = ["gui"]
