[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-videostitcher"
version = "0.3.0"
description = "用 MIDI 时间线编排音符视频素材的中文桌面工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mido>=1.3.3,<2", "imageio-ffmpeg>=0.6,<0.7"]

[project.scripts]
midi-videostitcher = "main:main"

[project.gui-scripts]
midi-videostitcher-gui = "gui:launch_gui"

[tool.setuptools]
py-modules = ["main", "gui", "notes", "renderer", "selection", "preview_player", "get_midi_info"]
packages = ["examples"]
